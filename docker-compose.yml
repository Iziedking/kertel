# Kertel on a VPS.
#
#   docker compose up -d          start the daemon
#   docker compose logs -f        watch it work
#   docker compose down           stop it (positions survive; the volume does not go)
#
# The .env file next to this compose file supplies every secret. It is never
# baked into the image and never committed.

services:
  kertel:
    build: .
    image: kertel:latest
    container_name: kertel
    restart: unless-stopped
    env_file: [.env]
    environment:
      KERTEL_DATA_DIR: /data
    volumes:
      # Named, not bind-mounted: the database must outlive both the container
      # and the image, and a stray `docker compose down -v` is the only thing
      # that should ever remove it.
      - kertel-state:/data
    # A trading agent has no reason to hold a machine's memory or CPU hostage.
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  kertel-state:
