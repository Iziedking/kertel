# Test, then deploy.
#
# The order is the point. This agent moves real money, so nothing reaches the
# server that has not first passed the whole suite — including the tests that
# pin the refusals, the reduce-only exits, and the forgery detection. A deploy
# job that does not depend on a green check job is a deploy job that will
# eventually ship a broken stop-loss.
#
# The VPS is reached over SSH with a deploy key held in repository secrets, so
# no human needs shell access for a routine release and no laptop needs to be
# awake for one.

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "fixtures/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "deploy/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {} # a redeploy by hand, from the Actions tab

concurrency:
  # One deploy at a time. Two overlapping `compose up` runs on the same host is
  # how a container ends up half-replaced.
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to the same minor the image runs. node:sqlite is still
          # experimental, and testing on a different minor than production
          # would defeat the point of pinning the image.
          node-version: "22.17"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Check
        run: npm run check

      - name: Build the image
        # Built here as well as on the server, so a Dockerfile mistake fails in
        # CI rather than halfway through a production deploy.
        run: docker build -t telt:ci .

  deploy:
    name: Deploy to the VPS
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            # Quoted, and checked before use. Unquoted, an unset secret makes
            # this `cd` with no argument (silently going home and deploying
            # into the wrong place) and a path with a space makes it `cd` with
            # two (which is what failed here). Neither should be discovered
            # halfway through a production deploy.
            # `xargs` with no arguments strips surrounding whitespace, which a
            # secret pasted from a terminal very often carries.
            APP_DIR="$(printf '%s' "${{ secrets.VPS_APP_DIR }}" | xargs)"
            if [ -z "$APP_DIR" ]; then
              echo "VPS_APP_DIR is not set. Add it under Settings > Secrets and variables > Actions." >&2
              exit 1
            fi
            # Self-healing rather than a precondition. A first deploy onto a
            # fresh machine should work, and so should one where the directory
            # was moved or removed -- being told "clone it yourself" is a poor
            # answer from something whose entire job is deploying.
            if [ ! -d "$APP_DIR/.git" ]; then
              # Clone only into somewhere that is absent or empty. NEVER delete
              # to make room: this path comes from a secret, and if it were ever
              # set to a parent directory a clearing step would take the rest of
              # the machine with it. A deploy that stops is recoverable; one
              # that removes the wrong directory is not.
              if [ -e "$APP_DIR" ] && [ -n "$(ls -A "$APP_DIR" 2>/dev/null)" ]; then
                echo "The configured path exists, is not a git checkout, and is not empty." >&2
                echo "Refusing to touch it. Check VPS_APP_DIR." >&2
                exit 1
              fi
              echo "No checkout at the configured path; cloning into it." >&2
              git clone https://github.com/Iziedking/kertel.git "$APP_DIR"
            fi
            cd "$APP_DIR"

            git fetch --all
            git reset --hard origin/main

            # The secrets file is never in the repository, so a fresh clone has
            # none. Without it the daemon starts with no credentials and says
            # so; the public endpoint is unaffected because it holds none by
            # design.
            if [ ! -f .env ]; then
              echo "No .env at $APP_DIR — the daemon will start without credentials." >&2
              cp .env.example .env
              chmod 600 .env
            fi

            # The daemon holds live positions, so it is replaced rather than
            # torn down: `up -d` recreates only what changed, and the named
            # volume carries every armed plan and high-water mark across.
            docker compose up -d --build

            # Wait for the public endpoint to actually answer before calling
            # this a success. A deploy that reports green while the container
            # is crash-looping is worse than one that fails.
            for i in $(seq 1 30); do
              # Through the container network, since neither container
              # publishes a port to the host any more.
              if docker compose exec -T telt-mcp node -e "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" > /dev/null 2>&1; then
                echo "endpoint healthy after ${i}s"
                exit 0
              fi
              sleep 1
            done

            echo "the endpoint did not become healthy; showing recent logs" >&2
            docker compose logs --tail 60 telt-mcp >&2
            exit 1

      - name: Reclaim disk
        # Old images accumulate until a small VPS runs out of room mid-deploy.
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            docker image prune -f
